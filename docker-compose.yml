services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: essayist
      POSTGRES_PASSWORD: password
      POSTGRES_DB: essayist_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: bash -c "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"
    environment:
      DATABASE_URL: postgres://essayist:password@db:5432/essayist_development
      RAILS_ENV: development
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
